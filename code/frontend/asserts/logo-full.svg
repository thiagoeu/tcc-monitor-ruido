<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Fundo transparente -->
  
  <!-- Ícone do Radar -->
  <g transform="translate(180, 200)">
    <!-- Setor / Feixe do Radar -->
    <path d="M 0,0 L -78,-78 A 110,110 0 0,1 0,-110 Z" fill="#9bd1b1" opacity="0.35"/>
    
    <!-- Círculos Concêntricos -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#9bd1b1" stroke-width="6" stroke-dasharray="320 70" stroke-dashoffset="-30"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#9bd1b1" stroke-width="5" opacity="0.7"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#9bd1b1" stroke-width="4" opacity="0.7"/>
    
    <!-- Linhas dos Eixos -->
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#9bd1b1" stroke-width="4" opacity="0.6"/>
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#9bd1b1" stroke-width="4" opacity="0.6"/>
    
    <!-- Arcos de Sinal (Superior Direito) -->
    <path d="M 12,-65 A 66,66 0 0,1 55,-35" fill="none" stroke="#87a6d8" stroke-width="6" stroke-linecap="round"/>
    <path d="M 12,-85 A 86,86 0 0,1 75,-42" fill="none" stroke="#e8a87c" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Pontos de Detecção -->
    <circle cx="20" cy="-35" r="5" fill="#87a6d8"/>
    <circle cx="45" cy="-20" r="5" fill="#e8a87c"/>
    <circle cx="65" cy="-12" r="5" fill="#e8a87c"/>
    <circle cx="0" cy="-118" r="4.5" fill="#9bd1b1"/>
    
    <!-- Onda Sonora Central (Batimento / Sinal) -->
    <path d="M -115,0 L -50,0 L -40,-25 L -25,25 L -10,-60 L 5,60 L 20,-30 L 35,15 L 45,0 L 115,0" 
          fill="none" stroke="#9bd1b1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tipografia "NoiseRadar" -->
  <g fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Montserrat, sans-serif" font-weight="600" font-size="78">
    <text x="325" y="225">Noise<tspan font-weight="700">Radar</tspan></text>
  </g>

  <!-- Detalhe do Sinal sobre o 'R' -->
  <g transform="translate(565, 140)">
    <path d="M 0,20 A 22,22 0 0,1 22,0" fill="none" stroke="#9bd1b1" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 0,10 A 12,12 0 0,1 12,0" fill="none" stroke="#9bd1b1" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
