<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoiseRadar - Login</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-brand">
          <img
            src="/asserts/logo_do_tcc_transparente.png"
            alt="NoiseRadar"
            class="brand-logo"
          />
        </div>
        <h1 class="login-title">NoiseRadar</h1>
        <p class="helper-text">Acesse o painel de monitoramento.</p>

        <form id="loginForm" class="login-form">
          <label>
            E-mail
            <input name="email" type="email" placeholder="seu@email.com" required />
          </label>
          <label>
            Senha
            <input name="senha" type="password" placeholder="••••••••" required />
          </label>
          <button type="submit">Entrar</button>
        </form>
        <div id="loginMessage" class="small form-message"></div>
      </div>
    </div>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
